<!doctype html><html><head><meta charset="utf-8"><title>Mini Operations ERP</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#222}header{background:#182230;color:white;padding:18px 28px}main{max-width:1100px;margin:25px auto;padding:0 15px}.card{background:white;padding:18px;margin:15px 0;border-radius:10px;box-shadow:0 1px 5px #ddd}input,select,button{padding:9px;margin:4px;border:1px solid #ccc;border-radius:6px}button{cursor:pointer;background:#182230;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:15px}pre{white-space:pre-wrap}.hidden{display:none}.danger{color:#b00020}</style></head><body><header><h2>Mini Operations ERP</h2></header><main>
<div id="login" class="card"><h3>Login</h3><input id="user" placeholder="Username" value="admin"><input id="pass" type="password" placeholder="Password" value="password"><button onclick="login()">Login</button><p>Demo: admin / ops / sales — password: password</p><div id="err" class="danger"></div></div>
<div id="app" class="hidden"><div class="card"><b id="who"></b> <button onclick="logout()">Logout</button></div><div class="grid"><section class="card"><h3>Inventory</h3><button onclick="load()">Refresh</button><pre id="inventory"></pre></section><section class="card"><h3>Work Order (Admin)</h3><input id="wi" placeholder="Item" value="Item A"><input id="wq" type="number" placeholder="Qty" value="20"><input id="wl" placeholder="Location" value="Pune"><input id="wu" placeholder="Assigned user" value="ops"><button onclick="work()">Create</button></section><section class="card"><h3>Transfer (Ops/Admin)</h3><input id="ti" placeholder="Item" value="Item A"><input id="tq" type="number" value="20"><input id="ts" placeholder="Source" value="Mumbai"><input id="td" placeholder="Destination" value="Pune"><button onclick="transfer()">Request</button><pre id="transfers"></pre></section><section class="card"><h3>Customer Reservation (Sales/Admin)</h3><input id="oi" placeholder="Item" value="Item A"><input id="oq" type="number" value="10"><input id="ol" placeholder="Location" value="Pune"><input id="oc" placeholder="Customer" value="Customer 1"><button onclick="reserve()">Reserve</button><pre id="orders"></pre></section></div><div class="card"><h3>API</h3><a href="/swagger-ui.html" target="_blank">Open Swagger UI</a></div></div></main><script>
let auth='';async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','Authorization':auth};let r=await fetch('/api'+path,opt);let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}async function login(){let u=document.getElementById('user').value,p=document.getElementById('pass').value;auth='Basic '+btoa(u+':'+p);try{let x=await api('/me');loginUI(x.username)}catch(e){document.getElementById('err').textContent='Invalid login'}}function loginUI(u){loginEl('login');loginEl('app',false);document.getElementById('who').textContent='Logged in: '+u;load()}function loginEl(id,hide=true){document.getElementById(id).classList.toggle('hidden',hide)}function logout(){auth='';loginEl('login',false);loginEl('app')}async function load(){try{inventory.textContent=JSON.stringify(await api('/inventory'),null,2);transfers.textContent=JSON.stringify(await api('/transfers'),null,2);orders.textContent=JSON.stringify(await api('/orders'),null,2)}catch(e){console.log(e)}}async function work(){try{await api('/work-orders',{method:'POST',body:JSON.stringify({item:wi.value,requiredQuantity:+wq.value,location:wl.value,assignedUser:wu.value})});alert('Work order created');}catch(e){alert(e.message)}}async function transfer(){try{await api('/transfers',{method:'POST',body:JSON.stringify({item:ti.value,quantity:+tq.value,sourceLocation:ts.value,destinationLocation:td.value})});load();alert('Transfer requested. Use Swagger to dispatch/receive by ID.')}catch(e){alert(e.message)}}async function reserve(){try{await api('/orders/reserve',{method:'POST',body:JSON.stringify({item:oi.value,quantity:+oq.value,location:ol.value,customer:oc.value,batch:'B1'})});load();alert('Reserved')}catch(e){alert(e.message)}}
</script></body></html>
