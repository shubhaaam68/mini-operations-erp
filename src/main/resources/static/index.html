<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Operations ERP</title><style>
:root{--navy:#182230;--bg:#f3f6fa;--card:#fff;--text:#182230;--muted:#667085;--line:#e4e7ec;--success:#067647;--warn:#b54708;--danger:#b42318;--blue:#175cd3}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,#182230,#243447);color:#fff;padding:22px 32px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #0002}header .brand{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}h1,h2,h3,p{margin-top:0}.brand h1{margin:0;font-size:24px}.sub{font-size:13px;color:#cbd5e1;margin-top:4px}.container{max-width:1180px;margin:28px auto;padding:0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 16px #1018280a;margin-bottom:18px}.login-card{max-width:430px;margin:70px auto}.label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:12px 0 5px}.input{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:9px;font-size:14px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #175cd31a}button{border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:#fff;cursor:pointer;font-weight:600}button.secondary{background:#eef2f6;color:var(--text)}button.danger{background:#b42318}button:disabled{opacity:.55;cursor:not-allowed}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.identity{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:12px;background:#e9eff8;display:grid;place-items:center;font-weight:800;color:var(--blue)}.role{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#175cd3;font-size:12px;font-weight:700}.location{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-8{grid-column:span 8}.span-12{grid-column:span 12}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-title h2{font-size:18px;margin:0}.hint{color:var(--muted);font-size:13px;line-height:1.5}.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px;border:1px solid var(--line);border-radius:10px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}.item{border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13px;background:#fafcff}.item strong{display:block;margin-bottom:4px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px}.status{font-size:11px;font-weight:700;border-radius:999px;padding:4px 8px;display:inline-block}.status.ok{background:#ecfdf3;color:var(--success)}.status.pending{background:#fffaeb;color:var(--warn)}.status.danger{background:#fef3f2;color:var(--danger)}pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:10px;font-size:12px;max-height:360px;overflow:auto}.hidden{display:none!important}.error{color:var(--danger);font-size:13px;margin-top:10px}.success{color:var(--success);font-size:13px;margin-top:10px}.api-link{display:inline-block;text-decoration:none;color:var(--blue);font-weight:700}.welcome{margin-bottom:18px}.empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}.role-note{padding:12px;border-radius:10px;background:#f8fafc;color:#475467;font-size:13px;border:1px solid var(--line)}@media(max-width:900px){.span-4,.span-6,.span-8{grid-column:span 12}}@media(max-width:600px){header{padding:18px}.container{margin:18px auto}.form-grid,.stat-row{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body>
<header><div class="brand"><div><h1>Mini Operations ERP</h1><div class="sub">Inventory • Work Orders • Transfers • Customer Reservations</div></div><a class="api-link" href="/swagger-ui.html" target="_blank" style="color:#dbeafe">Swagger API</a></div></header>
<main class="container">
<section id="login" class="card login-card"><h2>Sign in</h2><p class="hint">Use one of the demo accounts below to view its role-specific workspace.</p><label class="label">Username</label><input id="user" class="input" value="admin" placeholder="Username"><label class="label">Password</label><input id="pass" class="input" type="password" value="password" placeholder="Password"><button style="width:100%;margin-top:14px" onclick="login()">Sign in</button><div class="role-note" style="margin-top:14px">Demo users: <b>admin</b>, <b>ops</b>, <b>sales</b> &nbsp;•&nbsp; Password: <b>password</b></div><div id="err" class="error"></div></section>
<section id="app" class="hidden">
<div class="card welcome"><div class="topbar"><div class="identity"><div class="avatar" id="avatar">A</div><div><div style="font-weight:800;font-size:18px" id="who"></div><div class="location" id="where"></div></div><span class="role" id="role"></span></div><button class="secondary" onclick="logout()">Logout</button></div></div>
<div id="notice" class="card role-note"></div>
<div id="dashboard" class="grid"></div>
</section></main>
<script>
let auth='';let me=null;const api=(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json','Authorization':auth};return fetch('/api'+path,opt).then(async r=>{const t=await r.text();if(!r.ok)throw Error(t||r.statusText);return t?JSON.parse(t):null})};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function login(){const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;auth='Basic '+btoa(u+':'+p);try{me=await api('/me');renderApp()}catch(e){auth='';document.getElementById('err').textContent='Invalid username or password';}}
function logout(){auth='';me=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');}
function renderApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=me.username;document.getElementById('where').textContent=me.location?'Location: '+me.location:'';document.getElementById('role').textContent=me.role;document.getElementById('avatar').textContent=me.username.charAt(0).toUpperCase();const d=document.getElementById('dashboard');d.innerHTML='';
const r=me.role;
if(r==='ADMIN'){document.getElementById('notice').textContent='Administrator workspace: full access to inventory, work orders, transfers, and customer reservations.';d.innerHTML=adminHtml();loadAdmin();}
else if(r==='OPERATIONS_USER'){document.getElementById('notice').textContent='Operations workspace: manage inventory and warehouse transfers. Work-order creation and sales reservations are restricted.';d.innerHTML=opsHtml();loadOps();}
else if(r==='SALES_USER'){document.getElementById('notice').textContent='Sales workspace: view inventory and create customer reservations. Warehouse operations are restricted.';d.innerHTML=salesHtml();loadSales();}
else{document.getElementById('notice').textContent='Your account does not have a configured ERP role.';}
}
function inventoryCard(id){return `<section class="card span-4"><div class="section-title"><h2>Inventory</h2><button class="secondary" onclick="loadInventory('${id}')">Refresh</button></div><div id="${id}"></div></section>`}
function workCard(){return `<section class="card span-8"><div class="section-title"><div><h2>Work Orders</h2><div class="hint">Create and track production work.</div></div><button onclick="createWork()">Create Work Order</button></div><div class="form-grid"><div><label class="label">Item</label><input id="wi" class="input" value="Item A"></div><div><label class="label">Quantity</label><input id="wq" class="input" type="number" value="20" min="1"></div><div><label class="label">Location</label><input id="wl" class="input" value="Pune"></div><div><label class="label">Assigned user</label><input id="wu" class="input" value="ops"></div></div><div id="workMsg"></div><div id="works" class="list" style="margin-top:14px"></div></section>`}
function transferCard(){return `<section class="card span-8"><div class="section-title"><div><h2>Internal Transfers</h2><div class="hint">Move stock between locations and track dispatch/receipt.</div></div><button onclick="createTransfer()">Request Transfer</button></div><div class="form-grid"><div><label class="label">Item</label><input id="ti" class="input" value="Item A"></div><div><label class="label">Quantity</label><input id="tq" class="input" type="number" value="20" min="1"></div><div><label class="label">Source</label><input id="ts" class="input" value="Mumbai"></div><div><label class="label">Destination</label><input id="td" class="input" value="Pune"></div></div><div id="transferMsg"></div><div id="transfers" class="list" style="margin-top:14px"></div></section>`}
function reservationCard(){return `<section class="card span-8"><div class="section-title"><div><h2>Customer Reservations</h2><div class="hint">Reserve available stock for a customer order.</div></div><button onclick="reserve()">Reserve Stock</button></div><div class="form-grid"><div><label class="label">Item</label><input id="oi" class="input" value="Item A"></div><div><label class="label">Quantity</label><input id="oq" class="input" type="number" value="10" min="1"></div><div><label class="label">Location</label><input id="ol" class="input" value="Pune"></div><div><label class="label">Customer</label><input id="oc" class="input" value="Customer 1"></div></div><div id="orderMsg"></div><div id="orders" class="list" style="margin-top:14px"></div></section>`}
function adminHtml(){return inventoryCard('inv')+workCard()+transferCard()+reservationCard()+`<section class="card span-4"><div class="section-title"><h2>Quick View</h2></div><div class="stat-row"><div class="stat"><b id="invCount">–</b><span>Inventory rows</span></div><div class="stat"><b id="woCount">–</b><span>Work orders</span></div><div class="stat"><b id="trCount">–</b><span>Transfers</span></div></div><p class="hint" style="margin-top:12px">Use Swagger for API-level testing, including dispatch and receipt actions.</p></section>`}
function opsHtml(){return inventoryCard('inv')+transferCard()+`<section class="card span-4"><div class="section-title"><h2>Operations Access</h2></div><p class="hint">You can create inventory records and warehouse transfers. Work-order creation and customer reservations are protected by backend role checks.</p></section>`}
function salesHtml(){return inventoryCard('inv')+reservationCard()+`<section class="card span-4"><div class="section-title"><h2>Sales Access</h2></div><p class="hint">You can create customer reservations against available inventory. Warehouse transfer actions are protected by backend role checks.</p></section>`}
async function loadInventory(id){try{const rows=await api('/inventory');const el=document.getElementById(id);el.innerHTML=rows.length?rows.map(x=>`<div class="item"><strong>${esc(x.item)} <span class="status ok">${esc(x.location)}</span></strong><div class="meta"><span>Batch: ${esc(x.batch)}</span><span>Physical: ${x.physicalQuantity}</span><span>Reserved: ${x.reservedQuantity}</span><span>Available: ${x.physicalQuantity-x.reservedQuantity}</span></div></div>`).join(''):`<div class="empty">No inventory records</div>`;if(document.getElementById('invCount'))document.getElementById('invCount').textContent=rows.length}catch(e){document.getElementById(id).innerHTML='<div class="error">Unable to load inventory</div>'}}
async function loadWork(){const rows=await api('/work-orders');const el=document.getElementById('works');el.innerHTML=rows.length?rows.map(x=>`<div class="item"><strong>${esc(x.item)} <span class="status pending">${esc(x.status||'OPEN')}</span></strong><div class="meta"><span>Qty: ${x.requiredQuantity}</span><span>Location: ${esc(x.location)}</span><span>Assigned: ${esc(x.assignedUser)}</span><span>ID: ${x.id}</span></div></div>`).join(''):`<div class="empty">No work orders yet</div>`;if(document.getElementById('woCount'))document.getElementById('woCount').textContent=rows.length}
async function loadTransfers(){const rows=await api('/transfers');const el=document.getElementById('transfers');el.innerHTML=rows.length?rows.map(x=>`<div class="item"><strong>${esc(x.item)} <span class="status ${String(x.status).toLowerCase()==='received'?'ok':'pending'}">${esc(x.status||'REQUESTED')}</span></strong><div class="meta"><span>${esc(x.sourceLocation)} → ${esc(x.destinationLocation)}</span><span>Qty: ${x.quantity}</span><span>ID: ${x.id}</span></div></div>`).join(''):`<div class="empty">No transfer requests yet</div>`;if(document.getElementById('trCount'))document.getElementById('trCount').textContent=rows.length}
async function loadOrders(){const rows=await api('/orders');const el=document.getElementById('orders');el.innerHTML=rows.length?rows.map(x=>`<div class="item"><strong>${esc(x.customer)} <span class="status ok">${esc(x.status||'RESERVED')}</span></strong><div class="meta"><span>${esc(x.item)} • ${x.quantity}</span><span>Location: ${esc(x.location)}</span><span>ID: ${x.id}</span></div></div>`).join(''):`<div class="empty">No reservations yet</div>`}
async function loadAdmin(){await loadInventory('inv');await loadWork();await loadTransfers();await loadOrders()}
async function loadOps(){await loadInventory('inv');await loadTransfers()}
async function loadSales(){await loadInventory('inv');await loadOrders()}
async function createWork(){try{await api('/work-orders',{method:'POST',body:JSON.stringify({item:wi.value,requiredQuantity:+wq.value,location:wl.value,assignedUser:wu.value})});document.getElementById('workMsg').innerHTML='<div class="success">Work order created.</div>';loadWork()}catch(e){document.getElementById('workMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function createTransfer(){try{await api('/transfers',{method:'POST',body:JSON.stringify({item:ti.value,quantity:+tq.value,sourceLocation:ts.value,destinationLocation:td.value})});document.getElementById('transferMsg').innerHTML='<div class="success">Transfer requested. Use Swagger to dispatch/receive it.</div>';loadTransfers()}catch(e){document.getElementById('transferMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function reserve(){try{await api('/orders/reserve',{method:'POST',body:JSON.stringify({item:oi.value,quantity:+oq.value,location:ol.value,customer:oc.value,batch:'B1'})});document.getElementById('orderMsg').innerHTML='<div class="success">Stock reserved successfully.</div>';loadInventory('inv');loadOrders()}catch(e){document.getElementById('orderMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
</script></body></html>
